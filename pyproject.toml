[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-param-coverage"
version = "0.1.0"
description = "API Parameter Coverage & Test Scenario Generator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Fabricio Guidine"}]

dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "openai>=1.6.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
docs = ["PyPDF2>=3.0.1", "python-docx>=1.1.0"]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "behave>=1.2.6",
    "black>=23.12.1",
    "flake8>=6.1.0",
    "isort>=5.13.2",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
]

[project.urls]
Homepage = "https://github.com/fabricioguidine/api-param-coverage"
Repository = "https://github.com/fabricioguidine/api-param-coverage"
Issues = "https://github.com/fabricioguidine/api-param-coverage/issues"

[tool.black]
line-length = 127
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 127

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "-q", "--cov=src", "--cov-report=html", "--cov-report=term-missing"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for module interactions",
    "e2e: End-to-end workflow tests",
    "performance: Performance and benchmark tests",
    "security: Security and vulnerability tests",
    "regression: Regression test suite",
    "slow: Tests that take longer to run",
    "llm: Tests that require LLM API access",
    "network: Tests that require network access"
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true

