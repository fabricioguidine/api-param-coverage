[pytest]
# Test discovery
# Note: When using -c flag, paths are relative to where pytest is run from (project root)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
# Note: Remove --cov options if pytest-cov is not installed
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=10
    -ra

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for module interactions
    e2e: End-to-end workflow tests
    performance: Performance and benchmark tests
    security: Security and vulnerability tests
    regression: Regression test suite
    slow: Tests that take longer to run
    llm: Tests that require LLM API access
    network: Tests that require network access

# Test execution
norecursedirs = .git .venv venv __pycache__ htmlcov .pytest_cache

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S


